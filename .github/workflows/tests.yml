name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        # Pinned to match the release build (see release.yml).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e . pytest
      - run: pytest
